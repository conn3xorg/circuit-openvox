name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Check the manifest made its file, and a second run changes nothing
        working-directory: examples/local
        run: sudo podman exec -i circuit-openvox sh -s < check.sh
      # Restarting the container boots systemd again, so this checks the
      # timer comes back on, the package's agent service stays off at boot,
      # the manifest still applies and the plan has nothing to do.
      - name: Restart the host, then check the timer, the agent and the plan
        working-directory: examples/local
        run: |
          sudo podman restart circuit-openvox
          for _ in $(seq 60); do
            case $(sudo podman exec circuit-openvox systemctl is-system-running 2>/dev/null) in running|degraded) break ;; esac
            sleep 1
          done
          sudo podman exec -i circuit-openvox sh -s < check.sh
          conn3x plan -detailed-exitcode
      # A fresh host gets the previous release, then the circuit's own pin is
      # applied over it, the way someone raises openvox_version. Only the
      # x86_64 packages CI runs on are listed.
      - name: Upgrade from OpenVox 9.2.0 on a fresh host, then plan again with no changes
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: |
          ./down.sh
          ./up.sh
          conn3x init
          ubuntu=fb324fc165bec131e916147797dbbaad42c5fcfb0f2fe84c471590d219f48bce
          debian=b9879b33b131bea4dbced8bd171b43db349947b9ff8c4c5c7c84b655255d9e04
          el=10f2f0c627097dffa05c5860cdf9e0803688f77409d1ef0c25c899ad6fd5a8ea
          conn3x apply -auto-approve -var openvox_version=9.2.0 \
            -var "checksums={\"ubuntu/24.04/x86_64\"=\"$ubuntu\", \"debian/13/x86_64\"=\"$debian\", \"el/10/x86_64\"=\"$el\"}"
          [ "$(sudo podman exec circuit-openvox /opt/puppetlabs/bin/puppet --version)" = 9.2.0 ]
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          [ "$(sudo podman exec circuit-openvox /opt/puppetlabs/bin/puppet --version)" = 9.2.1 ]
      - name: Check the upgraded agent applies the manifest
        working-directory: examples/local
        run: sudo podman exec -i circuit-openvox sh -s < check.sh
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
